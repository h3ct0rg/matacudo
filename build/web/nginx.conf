# nginx configuration for the Godot web export.
#
# Differences from a stock config that actually matter here:
#   * .wasm is served as application/wasm — browsers refuse to instantiate
#     WebAssembly served as anything else, and the game would hang on the
#     Godot loading screen.
#   * .pck is served as application/octet-stream so it downloads as binary.
#   * index.html is never cached (a new build must be picked up immediately),
#     while the ~39 MB wasm is cached for a year because it only changes
#     between engine upgrades.
#   * No cross-origin isolation headers: this build is single-threaded and does
#     not need them.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # A Godot web build is a handful of files plus one large wasm.
    types {
        application/wasm wasm;
        application/octet-stream pck;
    }

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    # The Docker build stores a pre-compressed copy of the wasm, so nginx serves
    # that instead of spending CPU per request on 39 MB.
    gzip_static on;
    gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml application/wasm application/octet-stream;
    gzip_min_length 1024;
    # Do not buffer large downloads through the proxy layer.
    gzip_proxied any;
    gzip_vary on;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Never cache the entry point. It is the file that tells the browser
        # which version to load, so it must always be revalidated.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        # The versioned payload carries the release in its name (index-1.0.5.js,
        # index-1.0.5.wasm, index-1.0.5.pck), so a new release is a new URL and an
        # old cached copy can never be served. Safe to cache hard, forever.
        location ~* -[0-9]+\.[0-9]+(\.[0-9]+)*\.(js|wasm|pck)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            gzip_static on;
            try_files $uri =404;
        }

        # Any other package or loader (a previous release kept on disk, for
        # instance) is revalidated rather than trusted, so a stale one can never
        # be paired with a fresh index.html.
        location ~* \.(js|wasm|pck|png)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
