<!DOCTYPE html>
<!--
	Custom HTML shell for the Godot web export.

	It differs from the stock shell in the things that affect a phone:
	  * The page background is the game's own dark blue, so the space left over
	    around a 16:9 playfield on a portrait screen blends in instead of showing
	    as a grey band under a black canvas.
	  * The canvas is pinned to 100% of the dynamic viewport (svh/dvh), so the
	    game fills the screen and keeps filling it when the browser's URL bar
	    hides or the phone is rotated.
	  * Safe-area padding keeps the HUD clear of notches and rounded corners;
	    the padding is on the wrapper, so the canvas itself never moves.
	  * Tap highlighting, text selection and drag-to-scroll are disabled: on a
	    game you tap, all three fire by accident.
	Godot's own placeholders (index.js, Mata Zancudos, ...) are kept so
	the export can substitute them.
-->
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="color-scheme" content="dark">
		<meta name="theme-color" content="#0f1926">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>Mata Zancudos</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: white;
	/* Same colour as the game's menu background, so the letterbox around the
	   16:9 playfield is invisible on a portrait phone. */
	background-color: #0f1926;
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
}

/* Wrapper carries the safe-area padding; the canvas stays flush so resizing
   never leaves a gap. */
#game {
	position: fixed;
	inset: 0;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
	box-sizing: border-box;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0f1926;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 60%;
	max-width: 60%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	width: 50%;
	max-width: 320px;
	margin-top: 1.5em;
}

#status-notice {
	background-color: #14181d;
	color: white;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 14px;
	line-height: 1.3;
	padding: 1em;
	margin: 0 1.5em;
	text-align: center;
}

/* ---- Aviso de girar el teléfono -------------------------------------------
   The playfield is 16:9, so in portrait it can only use the middle third of
   the screen. The game keeps loading and running behind this overlay (it is
   never paused), so rotating shows the game instantly, already started. */
#orient {
	position: fixed;
	inset: 0;
	z-index: 20;
	background-color: #0f1926;
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 0.5em;
	padding: 2em;
	box-sizing: border-box;
	text-align: center;
	color: #eaf2f8;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

@media (orientation: portrait) and (pointer: coarse) {
	#orient.show { display: flex; }
}

#orient .phone {
	width: 58px;
	height: 100px;
	border: 4px solid #ff6a29;
	border-radius: 12px;
	animation: rotate-phone 2.4s ease-in-out infinite;
}

@keyframes rotate-phone {
	0%, 35% { transform: rotate(0deg); }
	65%, 100% { transform: rotate(-90deg); }
}

#orient .title {
	color: #ffd94a;
	font-size: 1.6em;
	font-weight: bold;
	margin-top: 0.6em;
}

#orient .hint {
	font-size: 1.05em;
	line-height: 1.4;
	max-width: 18em;
	color: #a9bccd;
}

#orient .skip {
	margin-top: 1em;
	padding: 0.6em 1.2em;
	font-size: 0.95em;
	color: #eaf2f8;
	background-color: #1b2a3d;
	border: 1px solid #33475f;
	border-radius: 10px;
}
		</style>
		<!-- The art and icon files keep the executable's base name, which is
		     fixed by the export, so they are referenced literally. -->
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png" />
	</head>
	<body>
		<div id="game">
			<canvas id="canvas">
				Tu navegador no soporta canvas.
			</canvas>
		</div>

		<noscript>
			Tu navegador no soporta JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="orient" role="status">
			<div class="phone"></div>
			<div class="title">Gira tu teléfono</div>
			<div class="hint">El juego se ve mucho más grande y se aplasta mejor en horizontal.</div>
			<button class="skip" onclick="dismissOrientationHint()">Continuar así</button>
		</div>

		<script>
// Shows the rotate hint on touch devices held in portrait. It never pauses or
// restarts the engine: the game keeps loading behind the overlay, so rotating
// lands straight in the running game.
(function () {
	var overlay = document.getElementById('orient');
	var seen = false;
	// "Continuar así" hides it, but only for a while: the hint is genuinely
	// useful, so it may return rather than being dismissed forever.
	var until = 0;
	var SNOOZE_MS = 120000;

	function update() {
		var portrait = window.matchMedia('(orientation: portrait)').matches;
		var touch = window.matchMedia('(pointer: coarse)').matches;
		var wanted = portrait && touch && Date.now() >= until;
		overlay.classList.toggle('show', wanted);
		if (wanted && !seen) {
			seen = true;
			console.log('Mata Zancudos: en vertical el juego usa solo el centro; sugiere girar.');
		}
	}

	window.dismissOrientationHint = function () {
		until = Date.now() + SNOOZE_MS;
		update();
	};

	window.addEventListener('orientationchange', update);
	window.addEventListener('resize', update);
	try {
		window.matchMedia('(orientation: portrait)').addEventListener('change', update);
		window.matchMedia('(pointer: coarse)').addEventListener('change', update);
	} catch (err) {
		// Older browsers: the resize listener above already covers this.
	}
	update();
}());
		</script>

		<!-- index.js already carries the .js extension. -->
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":164512,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocurrió un error desconocido.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nAl navegador le faltan funciones necesarias para ejecutar el juego:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
